apiVersion: v1
kind: Namespace
metadata:
  name: quantumfence
  labels:
    app: quantumfence

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qf-config
  namespace: quantumfence
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "false"
  DETECTION_CONFIDENCE: "0.65"
  DRONE_CONFIDENCE: "0.4"
  FRAME_SKIP: "3"
  MAX_CAMERAS: "64"
  MODEL_DEVICE: "auto"
  MODEL_HALF_PRECISION: "false"
  MODEL_AUTO_DOWNLOAD: "true"
  MODEL_ALLOW_MOCK_FALLBACK: "false"
  DRONE_TILED_INFERENCE: "false"
  LOW_LIGHT_MODE: "off"
  CAMERA_MOUNT_HEIGHT_METERS: "4.0"
  CAMERA_TILT_DEGREES: "15.0"
  AUTHORIZED_DRONE_ZONES: "[]"

---
apiVersion: v1
kind: Secret
metadata:
  name: qf-secrets
  namespace: quantumfence
type: Opaque
stringData:
  SECRET_KEY: "change-this-in-production"
  ANTHROPIC_API_KEY: ""
  GOOGLE_MAPS_API_KEY: ""
  DATABASE_URL: "postgresql://qfuser:qfpass@qf-postgres:5432/quantumfence"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qf-backend
  namespace: quantumfence
  labels:
    app: qf-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qf-backend
  template:
    metadata:
      labels:
        app: qf-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: qf-backend
          image: quantumfence/backend:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: qf-config
            - secretRef:
                name: qf-secrets
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: snapshots
              mountPath: /app/code/backend/snapshots
            - name: models
              mountPath: /app/code/ai_models/weights
      volumes:
        - name: snapshots
          persistentVolumeClaim:
            claimName: qf-snapshots-pvc
        - name: models
          persistentVolumeClaim:
            claimName: qf-models-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: quantumfence
spec:
  selector:
    app: qf-backend
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qf-frontend
  namespace: quantumfence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qf-frontend
  template:
    metadata:
      labels:
        app: qf-frontend
    spec:
      containers:
        - name: qf-frontend
          image: quantumfence/frontend:1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 30
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: qf-frontend-svc
  namespace: quantumfence
spec:
  selector:
    app: qf-frontend
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qf-ingress
  namespace: quantumfence
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: quantumfence.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qf-frontend-svc
                port:
                  number: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qf-snapshots-pvc
  namespace: quantumfence
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qf-models-pvc
  namespace: quantumfence
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
