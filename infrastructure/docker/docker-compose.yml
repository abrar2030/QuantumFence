name: quantumfence

services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: quantumfence/backend:${QF_VERSION:-1.0.0}
    container_name: qf-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://qfuser:${POSTGRES_PASSWORD:-qfpass}@db:5432/quantumfence
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: "8000"
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      MODEL_HALF_PRECISION: ${MODEL_HALF_PRECISION:-false}
      MODEL_AUTO_DOWNLOAD: ${MODEL_AUTO_DOWNLOAD:-true}
      MODEL_ALLOW_MOCK_FALLBACK: ${MODEL_ALLOW_MOCK_FALLBACK:-false}
      DRONE_TILED_INFERENCE: ${DRONE_TILED_INFERENCE:-false}
      LOW_LIGHT_MODE: ${LOW_LIGHT_MODE:-off}
      DETECTION_CONFIDENCE: ${DETECTION_CONFIDENCE:-0.5}
      DRONE_CONFIDENCE: ${DRONE_CONFIDENCE:-0.4}
      FRAME_SKIP: ${FRAME_SKIP:-3}
      CAMERA_MOUNT_HEIGHT_METERS: ${CAMERA_MOUNT_HEIGHT_METERS:-4.0}
      CAMERA_TILT_DEGREES: ${CAMERA_TILT_DEGREES:-15.0}
      AUTHORIZED_DRONE_ZONES: ${AUTHORIZED_DRONE_ZONES:-[]}
    volumes:
      - qf-snapshots:/app/code/backend/snapshots
      - qf-recordings:/app/code/backend/recordings
      - qf-models:/app/code/ai_models/weights
      - qf-logs:/app/code/backend/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - qf-network
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ""
    image: quantumfence/frontend:${QF_VERSION:-1.0.0}
    container_name: qf-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - qf-network

  db:
    image: postgres:16-alpine
    container_name: qf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantumfence
      POSTGRES_USER: qfuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qfpass}
    volumes:
      - qf-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - qf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qfuser -d quantumfence"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qf-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-qfredis}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-qfredis}
    volumes:
      - qf-redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - qf-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: qf-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - qf-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - qf-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: qf-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-qfgrafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - qf-grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - qf-network

volumes:
  qf-pgdata:
  qf-redis-data:
  qf-snapshots:
  qf-recordings:
  qf-models:
  qf-logs:
  qf-prometheus-data:
  qf-grafana-data:

networks:
  qf-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
