global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: quantumfence

scrape_configs:
  - job_name: quantumfence-backend
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
