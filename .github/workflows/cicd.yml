name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ============================================================
  # Job 2 -- Backend Tests (Python / Pytest)
  # ============================================================
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 20

    env:
      BACKEND_DIR: code/backend
      MODEL_AUTO_DOWNLOAD: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            code/backend/requirements.txt
            code/backend/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          grep -v -E '^(torch|torchvision|ultralytics)==' "${BACKEND_DIR}/requirements.txt" > "${RUNNER_TEMP}/requirements-ci.txt"
          grep -v -E '^types-' "${BACKEND_DIR}/requirements-test.txt" > "${RUNNER_TEMP}/requirements-test-ci.txt"
          python -m pip install -r "${RUNNER_TEMP}/requirements-ci.txt" -r "${RUNNER_TEMP}/requirements-test-ci.txt"

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            --timeout=120 \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

  # ============================================================
  # Job 3 -- AI Models Test & Validation (Pytest + coverage)
  # ============================================================
  ai_models_test:
    name: AI Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      BACKEND_DIR: code/backend
      AI_MODELS_DIR: code/ai_models
      MODEL_AUTO_DOWNLOAD: "false"
      # ai_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            code/backend/requirements.txt
            code/backend/requirements-test.txt

      # ai_models has no requirements file of its own; the backend pins the
      # stack it uses (numpy, OpenCV, ...). PyTorch and ultralytics are left out
      # on purpose: they are imported lazily and the tests use a fake YOLO model.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          grep -v -E '^(torch|torchvision|ultralytics)==' "${BACKEND_DIR}/requirements.txt" > "${RUNNER_TEMP}/requirements-ci.txt"
          grep -v -E '^types-' "${BACKEND_DIR}/requirements-test.txt" > "${RUNNER_TEMP}/requirements-test-ci.txt"
          python -m pip install -r "${RUNNER_TEMP}/requirements-ci.txt" -r "${RUNNER_TEMP}/requirements-test-ci.txt"

      - name: Byte-compile all ai_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling analysis, detectors, pipeline, tracking, training and tests ==="
          python -m compileall -q "${AI_MODELS_DIR}"

      - name: Verify public API and sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import ai_models

          for name in ai_models.__all__:
              getattr(ai_models, name)
              print(f"OK   ai_models.{name}")

          for module in (
              "config",
              "constants",
              "exceptions",
              "manager",
              "analysis.drone",
              "analysis.geometry",
              "analysis.loitering",
              "analysis.swarm",
              "analysis.threat",
              "core.base",
              "core.registry",
              "core.types",
              "detectors.mock",
              "detectors.yolo",
              "evaluation.benchmark",
              "evaluation.metrics",
              "export.exporter",
              "monitoring.metrics",
              "pipeline.detection_pipeline",
              "postprocessing.filters",
              "postprocessing.nms",
              "preprocessing.frame",
              "preprocessing.tiling",
              "tracking.drone_tracker",
              "tracking.kalman",
              "tracking.tracker",
              "training.train",
              "utils.device",
          ):
              importlib.import_module(f"ai_models.{module}")
              print(f"OK   ai_models.{module}")
          print("ai_models imports cleanly")
          PY

      - name: Run ai_models test suite
        working-directory: ${{ env.AI_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            --timeout=120 \
            --cov=ai_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ai_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-coverage-report
          path: code/ai_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- Backend Build
  # ============================================================

  backend_build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend_tests
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          push: false
          load: true
          tags: quantumfence/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test backend container
        run: |
          set -euo pipefail
          docker run -d --name qf-backend-smoke -p 8000:8000 \
            -e MODEL_AUTO_DOWNLOAD=false \
            -e SECRET_KEY=ci-smoke-test-secret-key \
            quantumfence/backend:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health -o health.json; then
              break
            fi
            sleep 2
          done
          test -s health.json
          cat health.json
          jq -e '.status == "healthy" and .components.detection_service == "running"' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/metrics)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/models/status)" = "401"
          test "$(docker exec qf-backend-smoke id -u)" = "10001"

      - name: Show container logs
        if: always()
        run: |
          docker logs qf-backend-smoke || true
          docker rm -f qf-backend-smoke || true

  # ============================================================
  # Job 5 -- Frontend Build
  # ============================================================
  frontend_build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
